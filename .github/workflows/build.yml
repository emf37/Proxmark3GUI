name: Build

# Proxmark3GUI CI: builds the GUI on Linux and Windows.
# - every push / PR: compile check, binaries as workflow artifacts
# - pushing a tag starting with "v": binaries are also attached to a GitHub Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    # Qt6 from the distro packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-serialport-dev libgl1-mesa-dev

      - name: Read project version
        id: ver
        run: echo "version=$(grep -E '^VERSION' src/Proxmark3GUI.pro | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: qmake
        run: |
          mkdir build
          cd build
          qmake6 ../src

      - name: make
        run: make -j"$(nproc)"
        working-directory: build

      - name: Package
        run: |
          cd build
          tar czf "../Proxmark3GUI-${{ steps.ver.outputs.version }}-linux-${GITHUB_SHA::7}.tar.gz" Proxmark3GUI

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proxmark3GUI-linux
          path: Proxmark3GUI-*.tar.gz
          if-no-files-found: error

  build-windows:
    # MSYS2's own Qt6 package: Qt and MinGW GCC come from the same repo and
    # are built against each other, so there is no toolchain mismatch
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64 + Qt6)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: false
          install: >-
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-gcc
            make

      - name: qmake
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          qmake6 ../src

      - name: make
        shell: msys2 {0}
        run: make -j"$(nproc)"
        working-directory: build

      # windeployqt copies the Qt DLLs, the platform plugin and the MinGW
      # runtime DLLs(libgcc/libstdc++/libwinpthread) next to the exe, so the
      # zip runs on machines without any Qt or MinGW installed
      - name: Deploy Qt runtime
        shell: msys2 {0}
        working-directory: build
        run: |
          if [ -f release/Proxmark3GUI.exe ]; then cd release; fi
          windeployqt6 --release Proxmark3GUI.exe

      - name: Package (zip)
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/Proxmark3GUI.pro -Pattern '^VERSION\s*=\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $bin = "build/release"
          if (-not (Test-Path "$bin/Proxmark3GUI.exe")) { $bin = "build" }
          # drop the object/moc files MSYS2 puts next to the exe
          $items = Get-ChildItem $bin | Where-Object { $_.Extension -ne ".o" -and $_.Name -notlike "moc_*" -and $_.Name -notlike "*.res" }
          Compress-Archive -Path $items.FullName -DestinationPath "Proxmark3GUI-$ver-win64-$sha.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proxmark3GUI-win64
          path: Proxmark3GUI-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release upload "$GITHUB_REF_NAME" * --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" * --generate-notes --repo "$GITHUB_REPOSITORY"
