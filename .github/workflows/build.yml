name: Build

# Proxmark3GUI CI: builds the GUI on Linux and Windows.
# - every push / PR: compile check, binaries as workflow artifacts
# - pushing a tag starting with "v": binaries are also attached to a GitHub Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    # Qt6 from the distro packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-serialport-dev libgl1-mesa-dev

      - name: Read project version
        id: ver
        run: echo "version=$(grep -E '^VERSION' src/Proxmark3GUI.pro | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: qmake
        run: |
          mkdir build
          cd build
          qmake6 ../src

      - name: make
        run: make -j"$(nproc)"
        working-directory: build

      - name: Package
        run: |
          cd build
          tar czf "../Proxmark3GUI-${{ steps.ver.outputs.version }}-linux-${GITHUB_SHA::7}.tar.gz" Proxmark3GUI

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proxmark3GUI-linux
          path: Proxmark3GUI-*.tar.gz
          if-no-files-found: error

  build-windows:
    # Official Qt 6.8 MinGW 64-bit binaries + the matching MinGW 13.1
    # toolchain. The official Qt is preferred over MSYS2's Qt because it
    # statically links icu/pcre2/harfbuzz/..., which keeps the deployed
    # package ~40MB smaller.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3 (official MinGW 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtserialport'
          tools: 'tools_mingw1310'

      - name: qmake
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\src

      - name: make
        shell: cmd
        run: mingw32-make -j%NUMBER_OF_PROCESSORS%
        working-directory: build

      # windeployqt copies the Qt DLLs and plugins; collect_dlls.sh adds the
      # MinGW runtime DLLs, so the zip runs on machines without any Qt or
      # MinGW installed
      - name: Deploy Qt runtime and collect DLLs
        shell: cmd
        working-directory: build
        run: |
          if exist release\Proxmark3GUI.exe cd release
          windeployqt --release Proxmark3GUI.exe
          bash "%GITHUB_WORKSPACE%\deploy\collect_dlls.sh" Proxmark3GUI.exe

      - name: Package (zip)
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/Proxmark3GUI.pro -Pattern '^VERSION\s*=\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $bin = "build/release"
          if (-not (Test-Path "$bin/Proxmark3GUI.exe")) { $bin = "build" }
          New-Item -ItemType Directory -Force "$bin/data" | Out-Null
          # drop the object/moc files the build puts next to the exe
          $items = Get-ChildItem $bin | Where-Object { $_.Extension -ne ".o" -and $_.Name -notlike "moc_*" -and $_.Name -notlike "*.res" }
          Compress-Archive -Path $items.FullName -DestinationPath "Proxmark3GUI-$ver-win64-$sha.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proxmark3GUI-win64
          path: Proxmark3GUI-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release upload "$GITHUB_REF_NAME" * --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" * --generate-notes --repo "$GITHUB_REPOSITORY"
